# Walk Home Check: the app's contract. Pippa refuses anything not declared here.
manifest_version: 1
persistence: none
app_author_name: "Nightingale"

app:
  id: hack.app_cd1d
  name: Streetwise
  version: 0.1.0
  summary: >-
    Checks your walk home at night: the street crimes police recorded along
    your route or around a place, and the light level when you walk, from
    daylight to dark.

agent_types:
  - personal

outcomes:
  - id: walk.check
    summary: Recorded street crime along a walk between two places, the walking time, and whether it will be dark
    example_phrases:
      - how's my walk home from the station tonight
      - crime along my walk from old street to angel
      - is my walk to clapham ok at night
      - will it be dark on my walk home
      - how risky is walking from oval to kennington
      - check my route home from the tube at midnight
      - walking back from a night out how risky
    inputs:
      - name: from_place
        type: string
        required: false
        description: >-
          Where the walk starts: a place name, station, street or UK postcode,
          as the user wrote it. If the message does not say, return an empty
          string rather than guessing.
      - name: to_place
        type: string
        required: false
        description: >-
          Where the walk ends: a place name, station, street or UK postcode,
          as the user wrote it. If the message does not say, return an empty
          string rather than guessing.
      - name: time
        type: string
        required: false
        description: >-
          The time the user plans to walk, as 24-hour HH:MM (for example
          "23:30" for 11.30pm, "00:15" for quarter past midnight). If no time
          is mentioned, return an empty string rather than guessing.
    output:
      - name: from_used
        type: string
        description: The start place that was found.
      - name: to_used
        type: string
        description: The end place that was found.
      - name: distance_km
        type: number
        description: Walking distance in kilometres, estimated from the straight line.
      - name: walk_minutes
        type: integer
        description: Estimated walking time in minutes.
      - name: crimes_total
        type: integer
        description: Street crimes police recorded along the walk in the month used.
      - name: violence_and_robbery
        type: integer
        description: How many of those were violence, sexual offences or robbery.
      - name: theft_from_person
        type: integer
        description: How many were theft from the person, such as phone snatching.
      - name: top_categories
        type: string
        description: The most common kinds of crime recorded, with counts.
      - name: month_used
        type: string
        description: The month of police data used, as YYYY-MM. Police data lags about two months.
      - name: walk_time
        type: string
        description: The time of the walk used, HH:MM UK time.
      - name: dark
        type: boolean
        description: Whether it will be dark at the time of the walk.
      - name: sunset
        type: string
        description: Sunset at the start of the walk, HH:MM UK time.
      - name: sunrise
        type: string
        description: Sunrise at the start of the walk, HH:MM UK time.

  - id: area.check
    summary: Recorded street crime within about 400 metres of one place, and when it gets dark there
    example_phrases:
      - is peckham ok to walk around at night
      - how dodgy is the area around finsbury park
      - what's crime like near e8 3ph
      - how much street crime is there in brixton
      - is it rough round elephant and castle
      - crime rate near my hotel in camden
    inputs:
      - name: place
        type: string
        required: false
        description: >-
          The one place the user asks about: a neighbourhood, station, street
          or UK postcode, as they wrote it. If the message does not name a
          place, return an empty string rather than guessing.
    output:
      - name: place_used
        type: string
        description: The place that was found.
      - name: crimes_total
        type: integer
        description: Street crimes police recorded within the radius in the month used.
      - name: violence_and_robbery
        type: integer
        description: How many of those were violence, sexual offences or robbery.
      - name: theft_from_person
        type: integer
        description: How many were theft from the person, such as phone snatching.
      - name: top_categories
        type: string
        description: The most common kinds of crime recorded, with counts.
      - name: month_used
        type: string
        description: The month of police data used, as YYYY-MM.
      - name: radius_m
        type: integer
        description: The distance around the place that was counted, in metres.
      - name: sunset
        type: string
        description: Sunset at the place, HH:MM UK time.
